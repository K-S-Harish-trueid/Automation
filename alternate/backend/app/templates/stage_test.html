<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K2 Stage Tester</title>
<script src="config.js"></script>
<style>
  /* Color tokens borrowed from the main app's style.css (--canvas, --accent,
     etc.) -- deliberately NOT the shared stylesheet itself and NOT the main
     sidebar/layout, so this stays a small standalone page (see backend/README.md,
     "Stage Tester" section, for why it's kept separate on purpose). */
  :root {
    --canvas: #091018;
    --surface: #111b25;
    --surface-raised: #182632;
    --border: #2a4353;
    --border-soft: #1d303e;
    --text: #f0f4fa;
    --text-soft: #c4d0de;
    --muted: #7e93a8;
    --accent: #4f9fff;
    --accent-soft: rgba(79, 159, 255, 0.10);
    --good: #3bc69a;
    --good-soft: rgba(59, 198, 154, 0.10);
    --danger: #f26d78;
    --danger-soft: rgba(242, 109, 120, 0.10);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --font-body: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
    --font-mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--canvas);
    color: var(--text);
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    line-height: 1.45;
  }
  a.back { font-size: 0.85rem; text-decoration: none; color: var(--accent); }
  h1 { font-size: 1.4rem; margin: 10px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.92rem; max-width: 640px; }

  .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px) {
    .layout-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .panel h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 4px; color: var(--text-soft); }
  label:first-of-type { margin-top: 0; }
  select, input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-raised);
    color: var(--text);
  }
  select:focus, input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .instructions {
    margin: 0 0 16px;
    padding: 10px 12px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    color: var(--text-soft);
  }

  .presets { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-soft);
    cursor: pointer;
  }
  .preset-btn:hover { background: var(--surface-raised); }
  .preset-btn.flagged-example { border-color: var(--danger); color: var(--danger); }
  .preset-btn.passing-example { border-color: var(--good); color: var(--good); }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
  button.primary {
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #06111f;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-soft);
    cursor: pointer;
  }
  button.secondary:hover { background: var(--surface-raised); }

  #fieldsContainer { border-top: 1px solid var(--border-soft); padding-top: 4px; margin-top: 16px; }

  .rules-intro { font-size: 0.9rem; color: var(--text-soft); margin: 0 0 10px; }
  ul.rules-points { margin: 0 0 10px; padding-left: 20px; font-size: 0.88rem; color: var(--text-soft); }
  ul.rules-points li { margin-bottom: 6px; }
  .rules-note { font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--border-soft); padding-top: 10px; margin-top: 10px; }

  .output-panel { margin-top: 20px; animation: fade-in 0.15s ease-in; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .placeholder-note { color: var(--muted); font-size: 0.88rem; }
  .checking { color: var(--muted); font-size: 0.9rem; }

  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }
  .badge.flagged { background: var(--danger-soft); color: var(--danger); }
  .badge.passed { background: var(--good-soft); color: var(--good); }

  ul.reasons { margin: 12px 0 0; padding-left: 20px; font-size: 0.9rem; }

  table.preview { border-collapse: collapse; margin-top: 14px; width: 100%; font-size: 0.88rem; }
  table.preview th, table.preview td { border: 1px solid var(--border-soft); padding: 7px 10px; text-align: left; }
  table.preview th { background: var(--surface-raised); color: var(--text-soft); font-weight: 600; }
  table.preview td.value { font-family: var(--font-mono); font-size: 0.85rem; }

  .empty-note { color: var(--muted); font-size: 0.88rem; margin-top: 10px; }
  .error { color: var(--danger); font-size: 0.88rem; margin-top: 10px; }
</style>
</head>
<body>
  <a class="back" href="/">&larr; Back to K2 Automation</a>
  <h1>Stage Tester</h1>
  <p class="sub">Try a single pipeline stage's rule against typed-in test values. Nothing here creates a job or saves anything -- it just runs the real check.</p>

  <div class="layout-grid">
    <div class="panel" id="controlsPanel">
      <h2>Test values</h2>
      <label for="stageSelect">Stage to test</label>
      <select id="stageSelect"></select>

      <div id="fieldsContainer"></div>
      <div class="presets" id="presets"></div>

      <div class="actions">
        <button class="primary" id="runBtn" type="button">Run Check</button>
        <button class="secondary" id="clearBtn" type="button">Clear</button>
      </div>
    </div>

    <div class="panel" id="rulesPanel">
      <h2>Rules followed</h2>
      <div class="instructions" id="instructions"></div>
      <div id="rulesContent"></div>
    </div>
  </div>

  <div class="panel output-panel" id="outputPanel">
    <h2>Result</h2>
    <div id="result"><div class="placeholder-note">Run a check to see the result here.</div></div>
  </div>

<script>
const API_BASE = window.K2_API_BASE || "/api";
let stages = {};

// Quick-fill examples per stage, purely a convenience for the tester's own
// input fields -- the actual flagging always runs through the real backend
// when Run Check is clicked, so there's no risk of these drifting from the
// real rules.
const EXAMPLES = {
  name_validate: {
    flagged: { ACCOUNT_FIRST_NAME: "J", ACCOUNT_MIDDLE_NAME: "John", ACCOUNT_LAST_NAME: "Smith" },
    passing: { ACCOUNT_FIRST_NAME: "Jane", ACCOUNT_MIDDLE_NAME: "Marie", ACCOUNT_LAST_NAME: "Smith" },
  },
  id_dob_validate: {
    flagged: { ID_TYPE: "doc", ID_NUMBER: "12345", ACCOUNT_HOLDER_DOB: "2000-01-01 00:00:00" },
    passing: { ID_TYPE: "Civil Id", ID_NUMBER: "123456", ACCOUNT_HOLDER_DOB: "1990-05-15 00:00:00" },
  },
  address_fix: {
    flagged: { ACCOUNT_ADDRESS: "JUNE", ADDRESS_CITY: "00000", ADDRESS_PROVINCE: "Baghdad" },
    passing: { ACCOUNT_ADDRESS: "AL-WAZIRIYA STREET 5", ADDRESS_CITY: "Baghdad", ADDRESS_PROVINCE: "Baghdad" },
  },
  mobile_fill: {
    flagged: { PHONE_NUMBER: "0000000" },
    passing: { PHONE_NUMBER: "07701231234" },
  },
  final_id_check: {
    flagged: { ID_TYPE: "Passport", ID_NUMBER: "123" },
    passing: { ID_TYPE: "Passport", ID_NUMBER: "A1234567" },
  },
};

const stageSelect = document.getElementById("stageSelect");
const instructionsEl = document.getElementById("instructions");
const fieldsContainer = document.getElementById("fieldsContainer");
const presetsEl = document.getElementById("presets");
const rulesContentEl = document.getElementById("rulesContent");
const resultEl = document.getElementById("result");
const runBtn = document.getElementById("runBtn");
const clearBtn = document.getElementById("clearBtn");

function renderFields(stageId) {
  const cfg = stages[stageId];
  fieldsContainer.innerHTML = "";
  presetsEl.innerHTML = "";
  instructionsEl.textContent = cfg ? cfg.instructions : "";
  renderRules(cfg ? cfg.rules : null);
  if (!cfg) return;

  for (const field of cfg.fields) {
    const label = document.createElement("label");
    label.setAttribute("for", "f_" + field);
    label.textContent = field;
    const input = document.createElement("input");
    input.type = "text";
    input.id = "f_" + field;
    input.dataset.field = field;
    input.placeholder = "test value";
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runCheck();
    });
    fieldsContainer.appendChild(label);
    fieldsContainer.appendChild(input);
  }

  const examples = EXAMPLES[stageId];
  if (examples) {
    presetsEl.appendChild(makePresetButton("Fill: flagged example", "flagged-example", examples.flagged));
    presetsEl.appendChild(makePresetButton("Fill: passing example", "passing-example", examples.passing));
  }

  const firstInput = fieldsContainer.querySelector("input");
  if (firstInput) firstInput.focus();
}

function renderRules(rules) {
  if (!rules) { rulesContentEl.innerHTML = ""; return; }
  let html = `<p class="rules-intro">${escapeHtml(rules.intro)}</p>`;
  html += '<ul class="rules-points">' + rules.points.map((p) => `<li>${escapeHtml(p)}</li>`).join("") + "</ul>";
  if (rules.note) {
    html += `<div class="rules-note">${escapeHtml(rules.note)}</div>`;
  }
  rulesContentEl.innerHTML = html;
}

function makePresetButton(label, cls, values) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "preset-btn " + cls;
  btn.textContent = label;
  btn.addEventListener("click", () => {
    for (const [field, value] of Object.entries(values)) {
      const input = document.getElementById("f_" + field);
      if (input) input.value = value;
    }
  });
  return btn;
}

async function loadStages() {
  const res = await fetch(`${API_BASE}/stage-test/stages`);
  stages = await res.json();
  stageSelect.innerHTML = "";
  for (const [id, cfg] of Object.entries(stages)) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = cfg.title;
    stageSelect.appendChild(opt);
  }
  if (stageSelect.value) renderFields(stageSelect.value);
}

stageSelect.addEventListener("change", () => {
  resultEl.innerHTML = '<div class="placeholder-note">Run a check to see the result here.</div>';
  renderFields(stageSelect.value);
});

clearBtn.addEventListener("click", () => {
  fieldsContainer.querySelectorAll("input[data-field]").forEach((input) => { input.value = ""; });
  resultEl.innerHTML = '<div class="placeholder-note">Run a check to see the result here.</div>';
  const firstInput = fieldsContainer.querySelector("input");
  if (firstInput) firstInput.focus();
});

runBtn.addEventListener("click", runCheck);

async function runCheck() {
  const stageId = stageSelect.value;
  if (!stageId) return;
  const fields = {};
  fieldsContainer.querySelectorAll("input[data-field]").forEach((input) => {
    fields[input.dataset.field] = input.value;
  });

  runBtn.disabled = true;
  resultEl.innerHTML = '<div class="checking">Checking…</div>';
  try {
    const res = await fetch(`${API_BASE}/stage-test/${encodeURIComponent(stageId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields }),
    });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    const data = await res.json();
    renderResult(data);
  } catch (err) {
    resultEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  } finally {
    runBtn.disabled = false;
  }
}

function renderResult(data) {
  const badge = data.flagged
    ? '<span class="badge flagged">FLAGGED</span>'
    : '<span class="badge passed">PASSED</span>';
  let html = badge;

  if (data.reasons && data.reasons.length) {
    html += '<ul class="reasons">' + data.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join("") + "</ul>";
  }

  if (data.auto_fix_preview && Object.keys(data.auto_fix_preview).length) {
    html += '<table class="preview"><thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead><tbody>';
    for (const [field, change] of Object.entries(data.auto_fix_preview)) {
      html += `<tr><td>${escapeHtml(field)}</td><td class="value">${escapeHtml(String(change.before))}</td><td class="value">${escapeHtml(String(change.after))}</td></tr>`;
    }
    html += "</tbody></table>";
  } else if (data.auto_fix_preview !== undefined && data.auto_fix_preview !== null && !data.flagged) {
    html += '<div class="empty-note">Nothing would change -- this address is already valid.</div>';
  }

  resultEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadStages();
</script>
</body>
</html>
