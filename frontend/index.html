<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K2 Automation</title>
<link rel="stylesheet" href="style.css?v=20260811-01" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Collapse pipeline sidebar" aria-expanded="true" title="Collapse pipeline sidebar"></button>
    <div class="brand">
      <button id="sidebarBrandToggle" class="brand-mark" type="button" aria-label="Collapse pipeline sidebar" aria-expanded="true" title="Collapse pipeline sidebar"><img class="brand-mark-art" src="assets/k2-details/brand-k2.png" alt="" aria-hidden="true" /></button>
      <div>
        <div class="eyebrow">KYC data pipeline</div>
        <h1>K2 Automation</h1>
      </div>
    </div>

    <div class="progress-panel" id="progressPanel" aria-label="Pipeline progress">
      <div class="progress-header">
        <span id="progressLabel">0 / 0 stages</span>
        <span id="progressPct" class="mono">0%</span>
      </div>
      <div class="stage-meter" id="stageMeter"></div>
    </div>

    <div class="sidebar-label" id="stageListLabel">Pipeline stages</div>
    <ul class="stage-list" id="stageList"></ul>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="main-context">
        <div class="job-context" id="jobContext">
          <span class="job-context-pill job-context-id" id="jobContextId">Data preparation</span>
        </div>
        <div class="main-context-actions">
          <button class="context-action" id="goToDashboardBtn" type="button" hidden>Dashboard</button>
          <button class="context-action context-rollback" id="rollbackJobBtn" type="button" hidden>Rollback</button>
        </div>
      </div>
      <section class="card" id="mainCard" aria-live="polite"></section>
    </div>
  </main>
</div>

<div id="toast"></div>

<div id="busyOverlay" class="busy-overlay hidden">
  <div class="busy-card">
    <div class="busy-kicker">Pipeline in progress</div>
    <div class="busy-progress-ring-wrap">
      <svg class="busy-progress-ring" width="108" height="108" viewBox="0 0 120 120">
        <circle class="busy-progress-ring-track" cx="60" cy="60" r="50" />
        <circle class="busy-progress-ring-fill indeterminate" id="progressRingFill" cx="60" cy="60" r="50" />
      </svg>
      <div class="busy-progress-ring-label">
        <div id="busyPercent" class="busy-percent mono"></div>
      </div>
    </div>
    <div id="busyText" class="busy-text">Processing…</div>
    <button id="checkNowBtn" class="secondary busy-check-btn">Check now</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js?v=20260811-01"></script>
</body>
</html>
